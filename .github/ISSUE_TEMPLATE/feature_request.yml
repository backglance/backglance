name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

        Backglance is deliberately small. Before writing, it's worth checking the [roadmap](https://github.com/backglance/backglance/blob/main/docs/reference/ROADMAP.md) — it lists what is planned for v1.x and v2.0, and also the explicit non-goals.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Backglance does this touch?
      options:
        - Capture (archiving notifications)
        - Timeline (menu bar or window)
        - Search
        - '"What did I miss" digest'
        - Privacy controls (retention, redaction, exclusions)
        - Rules (highlight, VIP, mute)
        - Actions (open, copy, delete, export)
        - Analytics
        - Sync
        - Accessibility
        - Localization
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: Backglance is local-only, zero-telemetry, with no account. Features that would send data anywhere are out of scope.
      options:
        - label: This feature works without sending anything off the Mac
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to contribute this feature
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature hasn't been requested
          required: true
        - label: I have checked the roadmap and non-goals
          required: true
