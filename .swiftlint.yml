# SwiftLint Configuration for Backglance

included:
  - Backglance
  - Packages
  - Tests
  - Widgets

excluded:
  - DerivedData
  - build            # -derivedDataPath and -clonedSourcePackagesDirPath target
  - .build
  - Packages/*/.build   # each package resolves its own checkouts when built with `swift build`
  - Packages/*/.swiftpm
  - .swiftpm
  - Pods
  - Carthage
  - vendor
  - Tests/Fixtures

# Rules
disabled_rules:
  - trailing_comma
  - opening_brace
  - statement_position

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Configurable rules
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 6
  error: 8

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - to
    - db
    - ok
    - os

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: "\\bprint\\s*\\("
    message: "Use Logger instead of print statements"
    severity: warning
    match_kinds:
      - identifier

  # Backglance privacy invariant #1: notification content must never reach a log.
  # These are the canonical rules from docs/operations/MONITORING_LOGGING.md.
  #
  # The alternation has to lead with `Log\.<category>` because that is how this codebase
  # actually logs — `Log.capture.error(…)`, `Log.parser.debug(…)`. An earlier version of
  # this rule keyed on the literal `logger.`, which no call site uses, so it matched
  # nothing at all and the invariant went unenforced. If you narrow these, check the
  # change against a real call site before trusting it.
  no_notification_content_in_logs:
    name: "No Notification Content in Logs"
    included: ".*\\.swift"
    excluded: ".*Tests.*"
    regex: '(Log\.(capture|adapter|parser|archive|search|digest|rules|ui|updater)|logger|Logger\()[^\n]*\.(body|title|subtitle|sender|threadID|thread_id|deepLink|deep_link|userInfo|plistData)\b'
    message: "Notification content must never be logged. Log a NotificationLogRef (id, bundleID, length) instead."
    severity: error

  no_string_describing_notification:
    name: "No String(describing:) on Notifications"
    included: ".*\\.swift"
    excluded: ".*Tests.*"
    regex: 'String\((describing|reflecting):\s*(parsed|notification|archived|raw|record)\b'
    message: "Interpolating a whole notification into a string risks leaking content into logs."
    severity: error
